name: CI                                  # the name shown in the Actions tab

on:
  pull_request:                           # run on every pull request
  push:
    branches: [main]                      # and on every push to main

concurrency:                              # if you push again, cancel the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read                          # least privilege: CI can only read the code

jobs:
  verify:                                 # this job name is what branch protection will ask for
    runs-on: ubuntu-latest
    timeout-minutes: 15                   # kills a hung run instead of burning minutes
    steps:
      - uses: actions/checkout@v4         # download the code

      # Must come BEFORE setup-node, otherwise `cache: pnpm` can't find pnpm.
      # No `version:` input needed: it reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4       # install Node
        with:
          node-version-file: .nvmrc       # use the version from .nvmrc
          cache: pnpm                     # reuse the pnpm store between runs

      - run: pnpm install --frozen-lockfile   # exact install from pnpm-lock.yaml
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build                   # runs tsc -b, then vite build